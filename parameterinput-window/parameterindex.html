<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic Boom Simulation Parameters</title>
    <link rel="stylesheet" href="./parameterstyles.css" />
</head>

<body>

    <h1>Want to hear a sonic boom?</h1>

    <main class="story-container">
        <div class="btn-container">

            <div class="input-row">
                <label>Sampling Frequency:</label>
                <input id="Fs" type="number" value="24000">
            </div>
            
            <div class="input-row">
                <label>X Initial:</label>
                <input id="xinitial" type="number" value="145">
            </div>
            
            <div class="input-row">
                <label>Y Initial:</label>
                <input id="yinitial" type="number" value="35">
            </div>

            <div class="input-row">
                <label>Z Initial:</label>
                <input id="zinitial" type="number" value="0.0">
            </div>

            <div class="input-row">
                <label>Radius:</label>
                <input id="radius" type="number" value="0.15">
            </div>

            <div class="input-row">
                <label>Soundspeed:</label>
                <input id="soundspeed" type="number" value="348.537">
            </div>

            <div class="input-row">
                <label>ps or Atmospheric Pressure:</label>
                <input id="ps" type="number" value="1.0">
            </div>

            <div class="input-row">
                <label>Temp:</label>
                <input id="Temp" type="number" value="302.182778">
            </div>

            <div class="input-row">
                <label>hr or Relative Humidity:</label>
                <input id="hr" type="number" value="20">
            </div>

            <div class="input-row">
                <label>Theta:</label>
                <input id="theta" type="number" value="1.6863372">
            </div>
            
            <div class="input-row">
                <label>Phi:</label>
                <input id="phi" type="number" value="3.44458181">
            </div>
            
            <div class="input-row">
                <label>Boom Spacing:</label>
                <input id="boomspacing" type="number" step="0.01" value="0.6">
            </div>

            <div class="input-row">
                <label>Step Size:</label>
                <input id="h" type="number" value="10">
            </div>
            
            <!-- <input id="user-input" placeholder="Type something..." /> -->
            

            <button id="run-btn">Run Simulation</button>

        </div>
        <p id="result"></p>
    </main>
    <script src="./parameterscript.js"></script>

</body>

</html>
